# Version Catalog: única fonte de versões (docs/harness/guides/gradle.md).
# Só versões estáveis (ADR-0007). Consultadas em 2026-10-17/18 em Google Maven, Maven Central e Gradle Plugin Portal.
[versions]
# Build
androidGradlePlugin = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
# SDK (lidos só nos convention plugins)
compileSdk = "37" # Compose BOM 2026.09 exige 37; targetSdk sobe só com o checklist de mudanças de comportamento
targetSdk = "36"
minSdk = "24"
# AndroidX (template oficial `android create empty-activity`; BOM atualizado)
androidxCore = "1.18.0"
androidxActivity = "1.13.0"
androidxSplashscreen = "1.2.0"
androidxLifecycle = "2.11.0"
androidxComposeBom = "2026.09.00"
androidxNavigation = "2.10.2"
androidxHiltNavigation = "1.4.0"
room = "2.8.5"
# Stack de referência (ADR-0007)
hilt = "2.60.1"
coroutines = "1.11.0"
timber = "5.0.1"
kotlinxSerialization = "1.11.0"
kotlinxCollectionsImmutable = "0.5.2"
desugarJdkLibs = "2.1.5"
# QR Code do ingresso (spec 002, Q7 aprovada em 2026-10-19; 3.5.4 é a última estável no Maven Central)
zxing = "3.5.4"
# Testes (ADR-0003)
junit = "5.14.4"
mockk = "1.14.11"
turbine = "1.2.1"
robolectric = "4.17"
# Sensores (ADR-0003)
spotless = "8.10.4"
detekt = "1.23.8"
composeRules = "0.6.8"
kover = "0.9.11"
konsist = "0.18.1"
moduleGraphAssertion = "2.9.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHiltNavigation" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-core = { module = "com.google.dagger:hilt-core", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
javax-inject = { module = "javax.inject:javax.inject", version = "1" } # JSR-330; domain usa @Inject sem Hilt

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" } # só Robolectric/Compose em :ui (testing.md)
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
detekt-api = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
composeRules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRules" }

# Plugins usados pelo build-logic (classpath dos convention plugins)
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
moduleGraphAssertion-gradlePlugin = { module = "com.jraska.module.graph.assertion:com.jraska.module.graph.assertion.gradle.plugin", version.ref = "moduleGraphAssertion" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Convention plugins (build-logic)
app-root = { id = "app.root" }
app-android-application = { id = "app.android.application" }
app-android-library = { id = "app.android.library" }
app-android-compose = { id = "app.android.compose" }
app-android-feature-ui = { id = "app.android.feature.ui" }
app-android-feature-data = { id = "app.android.feature.data" }
app-jvm-library = { id = "app.jvm.library" }
app-hilt = { id = "app.hilt" }
app-android-room = { id = "app.android.room" }
