# CD do case (ADR-0009): APK instalável para quem for avaliar, sem loja nem assinatura de produção.
# - push em main: APK de debug como artefato do run.
# - tag v*: GitHub Release com o APK anexado.
# O APK de debug é assinado com a chave de debug efêmera do runner (S3: sem keystore de release).
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true # zizmor cache-poisoning: o APK publicado não usa cache
      - name: Build APK de debug
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bilheteria-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # criar a release e anexar o APK
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bilheteria-debug-apk
          path: apk
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" apk/*.apk --repo "$REPO" --title "$TAG" --generate-notes
